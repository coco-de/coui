name: docs_site
description: CoUI 컴포넌트 라이브러리 문서 사이트
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  # The client starts the drop receiver alongside generated web-plugin
  # registration, before a deferred Flutter DropTarget mounts.
  file_drop: ^1.0.1
  flutter:
    sdk: flutter
  jaspr: ^0.24.0-beta.1
  jaspr_content: ^0.6.0-beta.0
  jaspr_router: ^0.10.0-beta.1
  jaspr_flutter_embed: ^0.5.0-beta.0
  # `main.server.dart` builds a `MarkdownParser.documentBuilder` directly
  # (heading-anchor slug fix, see docs_core's `markdown/heading_slug.dart`)
  # — a direct import needs a direct dependency, not the transitive one
  # `jaspr_content` already pulls in.
  markdown: ^7.3.0
  syntax_highlight_lite: ^0.0.1
  # SSR-safe conditional-import counterpart (`dart.library.js`) used by the
  # `breakpoint` doc example's window-resize listener — same version
  # constraint as `coui_web`'s own `web_dom_utils_web.dart` usage.
  web: ^1.1.1
  coui_web:
    path: ../packages/coui_web
  coui_flutter:
    path: ../packages/coui_flutter
  coui_core:
    path: ../packages/coui_core
  # docs_app 과 공유하는 문서 코어 — 카탈로그·프리뷰 제약·예제/코드 레지스트리·
  # embed 페이지·콘텐츠(content/**.md). 사이트는 여기서 읽고, docs_app 도 같은
  # 패키지를 읽어 두 표면이 갈라질 수 없다.
  docs_core:
    path: ../docs_core

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.15
  # 서버 렌더 마크업을 요소 타입으로 읽는다(`jaspr_test` 가 돌려주는 문서).
  html: ^0.15.0
  jaspr_builder: ^0.24.0-beta.1
  jaspr_test: ^0.24.0-beta.1
  lints: ^6.0.0
  test: any

flutter:
  uses-material-design: true
  # 마크다운 콘텐츠 asset 은 docs_core 가 노출한다 (docs_app 이
  # `packages/docs_core/content/...` 로 읽음) — 사이트 자신은 asset 이 아니라
  # `FilesystemLoader('../docs_core/content')` 로 같은 디렉터리를 직접 읽는다.
  fonts:
    # Static per-weight Pretendard v1.3.9 canonical OTF masters — the
    # exact files the Web side's CDN static CSS serves, so every glyph
    # (including punctuation like the required-marker *) matches the Web
    # rendering. Not the single variable font (variable-font weight on
    # Flutter web is unreliable) and not a TTF conversion (a converted
    # TTF shipped older glyph shapes — the * rendered 5-spoked while the
    # Web CDN drew 6 spokes). Flutter renders each FontWeight from a
    # hand-tuned master, via both the `.medium` chain and a direct
    # `Text(style: TextStyle(fontWeight:))`.
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Thin.otf
          weight: 100
        - asset: fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: fonts/Pretendard-Light.otf
          weight: 300
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
        - asset: fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: fonts/Pretendard-Black.otf
          weight: 900
    # No mono family here. Code roles name `Geist Mono` (CoreFontFamily),
    # and the GeistMono masters coui_flutter bundles draw it through the
    # role's fallback — the face itself, not a stand-in. Declaring another
    # copy would only add bytes Flutter web downloads before its first
    # frame. The GeistMono files in fonts/ are for the parity tooling and
    # the docs tests; the Web side's @font-face reads coui_flutter's copies
    # (docs_core/lib/site_head.dart).

jaspr:
  mode: static
  flutter: embedded
