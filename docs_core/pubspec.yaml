name: docs_core
description: >-
  docs_site(jaspr 웹)와 docs_app(네이티브 Flutter)이 공유하는 문서 코어 —
  컴포넌트 카탈로그·프리뷰 제약/레이아웃·예제/코드 레지스트리·embed 페이지·
  아이콘 카탈로그 데이터·콘텐츠(content/**.md). 두 소비자가 같은 파일을 읽는
  단일 출처라, 한쪽만 갱신되어 갈라지는 일이 구조적으로 불가능하다.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  coui_core:
    path: ../packages/coui_core
  coui_flutter:
    path: ../packages/coui_flutter
  coui_web:
    path: ../packages/coui_web
  flutter:
    sdk: flutter
  # embed 페이지(jaspr 컴포넌트)와 그 head 조각들.
  jaspr: ^0.24.0-beta.1
  # site_head 의 docsContentTheme() — 본 사이트와 embed 가 공유하는 ContentTheme.
  jaspr_content: ^0.6.0-beta.0
  # markdown/heading_slug.dart — docs_site 와 docs_app 이 공유하는 유니코드
  # 인식 heading anchor slug (package:markdown 의 ASCII 전용 슬러그 대체).
  markdown: ^7.3.0
  # The shared Native rich-text link renderer owns this existing launcher edge.
  url_launcher: ^6.3.2

dev_dependencies:
  # 프리뷰 geometry 회귀 테스트(menubar_preview_overflow_test)는 실제 예제
  # 위젯을 뷰 크기에 맞춰 펌프해 오버플로를 잡는다 — 순수 Dart `test` 로는
  # 렌더 트리를 세울 수 없다.
  flutter_test:
    sdk: flutter
  test: any

# analysis_options.yaml 은 docs_site 와 동일한 완화 룰이다 — 이 패키지는
# docs_site 에서 이사한 기존 코드라, 이동이 룰 베이스라인을 바꾸지 않게
# 한다 (루트 coui_lints 로의 강화는 별도 작업).

flutter:
  # 문서 콘텐츠를 Flutter 자산으로 노출한다 — docs_app 의 content_repository 가
  # rootBundle 로 읽는다. docs_site(jaspr)는 자산이 아니라 파일시스템 로더로
  # 같은 디렉터리를 직접 읽는다 (main.server.dart 의 FilesystemLoader).
  # `_data` 는 사이트 메타(site.yaml)라 포함하고, `_templates` 는 라우트가
  # 아니므로 뺀다. 새 최상위 디렉터리(`content/<dir>/`)를 만들면 여기에
  # 한 줄을 더한다 — `content/` 만으로는 한 단계 아래 md 가 번들에 안 탄다.
  assets:
    - content/
    - content/_data/
    - content/blocks/
    - content/components/
    - content/guides/
    - content/tokens/
