include: ../../analysis_options.yaml

# Apply the repository's formatting rules in standalone package checkouts too.
formatter:
  trailing_commas: preserve
  page_width: 80

analyzer:
  errors:
    # The include above is available when this package is in the workspace.
    include_file_not_found: ignore
  exclude:
    - 'example/**'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
