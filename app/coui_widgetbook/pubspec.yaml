name: coui_widgetbook
description: CoUI(디자인 시스템)의 컴포넌트와 테마를 시연하는 Widgetbook 앱.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.0"
resolution: workspace
dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  coui_flutter:
    path: ../../packages/coui_flutter
  coui_i10n:
    path: ../../packages/coui_i10n
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  widgetbook: ^4.0.0-beta.9
dev_dependencies:
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  icons_launcher: ^3.0.1
  lint: ^2.14.0
  # On-device harness for the Tier 2 refraction feasibility probe. It lives
  # here rather than in a package because the value it reads is a runtime
  # property of the embedder — `flutter_tester` answers `false` regardless of
  # the platform's real capability, so a value collected without a device says
  # nothing.
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  # Share the exact static font masters used by docs_site. Without these,
  # CoreTypography silently falls back and the component geometry changes.
  # No mono family: code roles name `Geist Mono`, and the GeistMono masters
  # coui_flutter bundles draw it through the role's fallback.
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Thin.otf
          weight: 100
        - asset: fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: fonts/Pretendard-Light.otf
          weight: 300
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
        - asset: fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: fonts/Pretendard-Black.otf
          weight: 900
  shaders:
    - shaders/probe.frag
    - shaders/probe_no_sampler.frag
    - shaders/probe_size.frag
    - shaders/probe_half_texel.frag
    - shaders/probe_half_texel_bilinear.frag
    - shaders/probe_uniforms5.frag
    - shaders/probe_coords.frag
