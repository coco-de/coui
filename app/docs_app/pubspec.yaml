name: docs_app
description: >-
  CoUI 문서를 네이티브 Flutter 로 여는 docs_site 의 쌍둥이 앱. Web 프리뷰는 WebView 로,
  나머지는 전부 Flutter 로 렌더한다.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  coui_flutter:
    path: ../../packages/coui_flutter
  # Web 프리뷰를 in-process 로 렌더하려고 직접 의존한다. jaspr 서버 렌더러가
  # coui_web 컴포넌트를 HTTP 서버 없이 HTML 문자열로 만들고, 그걸
  # WebView.loadHtmlString 으로 띄운다 — jaspr serve·localhost·adb reverse 가
  # 필요 없다. 네이티브 전용(dart:io)이라 web 빌드는 conditional import 로 저하.
  coui_web:
    path: ../../packages/coui_web
  # 콘텐츠(content/**.md)·카탈로그·프리뷰 제약·예제/코드 레지스트리·embed
  # 페이지의 단일 출처 — docs_site 와 같은 패키지를 읽어 두 표면이 갈라질 수
  # 없다. 예제 273개의 import 는 전부 coui_flutter 하나뿐이고, 코드
  # 레지스트리는 import 0 인 순수 String 이다 — 복제하는 대신 읽는다.
  docs_core:
    path: ../../docs_core
  flutter:
    sdk: flutter
  # 153개 문서 라우트를 docs_site 와 같은 URL 로 노출한다 (URL 파리티).
  go_router: ^14.6.2
  # 위 in-process 렌더에 쓰는 jaspr 서버 렌더러(renderComponent).
  jaspr: ^0.24.0-beta.1
  # docs_site 의 MarkdownParser 와 동일한 파서 (ExtensionSet.gitHubWeb).
  markdown: ^7.3.0
  meta: ^1.16.0
  url_launcher: ^6.3.2
  # macOS 는 endorsed webview_flutter_wkwebview 가 제공한다.
  webview_flutter: ^4.14.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

# analysis_options.yaml 을 의도적으로 두지 않는다 — 애널라이저가 워크스페이스
# 루트까지 걸어 올라가 very_good_analysis + coui_lints 규칙을 그대로 적용하게
# 한다. 루트 설정이 명시하듯 그 플러그인은 루트에만 배선 가능하므로, 여기에
# 파일을 두는 순간(docs_site 가 그랬듯) 룰 강제가 통째로 꺼진다.

flutter:
  uses-material-design: true
  # changelog.md 의 `<CurrentVersion />` · `<ChangelogPreview />` 가 읽는
  # 패키지별 pubspec.yaml · CHANGELOG.md. docs_site 는 같은 파일을 dart:io 로
  # 읽는데, 번들 앱은 그 경로에 닿지 못한다.
  #
  # `release/` 안은 전부 `packages/<pkg>/` 로 가는 **심링크**다 — 사본이
  # 아니다. 릴리스마다 두 파일이 바뀌므로 사본은 첫 릴리스에 낡는다.
  #
  # 이 방식만 되는 이유 두 가지:
  # - `../../packages/...` 를 직접 적으면 키가 `../` 로 시작해 빌드가
  #   출력 디렉터리 **밖**에 파일을 쓴다 (실측: build/unit_test_assets 옆이
  #   아니라 app/docs_app/packages/ 에 떨어진다).
  # - 이름이 `pubspec.yaml` 이면 애널라이저가 그 자리를 또 하나의 패키지
  #   루트로 읽는다. 그래서 `<pkg>.pubspec.yaml` 이다.
  #
  # 링크가 끊기거나 사본으로 바뀌면 release_tags_test.dart 가 빨개진다.
  assets:
    - release/
  # docs_site 와 동일한 폰트를 네이티브로 번들한다. CoUI 타이포는 sans 를
  # `Pretendard` 로 참조하는데(CoreFontFamily), 이 폰트를 앱이 제공하지
  # 않으면 Flutter 가 대체 서체로 그려 Web 페인(CDN Pretendard)보다 글자
  # 폭이 달라진다 — 같은 버튼이 네이티브에선 더 넓게(또는 좁은 프리뷰에서
  # 잘려) 그려져 Web/Flutter 파리티가 깨진다. docs_site 의 per-weight 정적
  # 마스터를 그대로 복사해 글리프까지 일치시킨다.
  #
  # mono(`Geist Mono`)는 선언하지 않는다. coui_flutter 가 번들한 GeistMono
  # 가 코드 역할의 대체 자리에서 그 서체 자체를 그리므로, 사본을 또 두면
  # Flutter web 이 첫 프레임 전에 내려받는 바이트만 늘어난다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Thin.otf
          weight: 100
        - asset: fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: fonts/Pretendard-Light.otf
          weight: 300
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
        - asset: fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: fonts/Pretendard-Black.otf
          weight: 900
