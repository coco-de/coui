##################################################################################
##                      모노레포 전역 분석/린트 설정                                 ##
##                      -----------------------------                           ##
## 각 패키지에 별도 `analysis_options.yaml`이 없어도 됩니다.                         ##
## 분석기는 현재 경로에서 상위로 올라가며 설정 파일을 탐색합니다. 자세한 설명:        ##
## https://dart.dev/guides/language/analysis-options#the-analysis-options-file  ##
##################################################################################
##
# 린트 셋 합성:
#   - very_good_analysis — 주 기반 규칙
#   - lint/strict — VGA 에 없는 11개 규칙 보강. 두 셋은 겹치는 규칙이 전부
#     같은 값이라 값 충돌이 0 이고, lint 쪽이 순수 상위집합 +11 이다(실측).
#
# include 에 버전을 박지 않는다 — `analysis_options.9.0.0.yaml` 이 박혀 있는
# 동안 의존성 제약은 ^10 으로 올라가 있었고, 그 어긋남은 아무 신호도 내지
# 않았다(파일이 존재하기만 하면 analyzer 는 통과시킨다). caret 제약이 major 를
# 잠그므로 include 는 그 제약이 해석한 것을 그대로 따른다.
##
include:
  - package:very_good_analysis/analysis_options.yaml
  - package:lint/strict.yaml

##
# 포매터 설정은 **여기서 명시**한다. very_good_analysis 11 의 기본값은
# `automate` 라, 상속하면 `dart format` 이 trailing comma 를 지우며 줄을 접어
# 리포 전체가 재포맷된다. `preserve` + 80 은 지금 커밋된 코드의 모양이다.
#
# ⚠️ 이 블록은 **이 파일에 닿는 옵션 파일에만** 적용된다. 루트를 include 하지
# 않는 옵션 파일(coui_mcp · coui_flutter/example · docs_site · docs_core)은
# 자기 블록을 따로 가져야 하며, `dart format` 은 analyzer 와 달리 exclude 를
# 읽지 않으므로 그 사각지대가 곧 재포맷이다.
# `scripts/guards/structure/check_formatter_preserve.sh` 가 전수로 강제한다.
##
formatter:
  trailing_commas: preserve
  page_width: 80

##
# CoUI 전용 analyzer plugin (packages/coui_lints) — jaspr_lints 와 동일한
# analysis_server_plugin 아키텍처. 워크스페이스 루트에만 배선 가능(nested
# analysis_options.yaml 불가). 각 룰은 lint rule 로 등록되어 기본 비활성 —
# 아래 diagnostics: 로 명시 활성화해야 dart analyze / IDE 에 노출된다.
# `true` 는 기본 INFO — --fatal-warnings CI 를 깨지 않고 훅(--fatal-infos)이
# 만진 파일에서만 막는다. CI 게이트로 올리려면 값에 severity 를 쓴다
# (`warning`). `analyzer: errors:` 는 플러그인 진단에 닿지 않는다 — 거기 쓰면
# 조용히 INFO 로 남는다(실측). 참고: packages/coui_lints/README.md.
##
plugins:
  coui_lints:
    path: packages/coui_lints
    diagnostics:
      avoid_framework_import: true
      prefer_stacks_and_position: true
      avoid_material_icon_glyph: true
      prefer_text_chain: true
      avoid_hardcoded_duration: true
      avoid_hardcoded_chrome_literal: true
      avoid_dynamic_event_target: true
      avoid_override_prefixed_resolved_field: true
      avoid_local_token_constant: true
      # warning — CI 게이트. 위반 0 에서 켰으므로 올리는 비용이 없고, 이
      # 결함은 화면에 증상이 없어 훅만으로는 새어 나간다: 빠뜨린 필드는
      # 생성자 기본값으로 조용히 리셋되고, 스타일 체인(`withStyle`)이
      # copyWith 를 타므로 스타일 하나 얹는 순간 그 필드를 잃는다.
      avoid_incomplete_copy_with: warning
      # 둘 다 위반 0 에서 켠 warning — 관례가 이미 지켜지고 있으니 게이트로
      # 올리는 비용이 없고, 올리지 않으면 다음 위반이 리뷰 말고는 걸릴 데가 없다.
      prefer_k_prefixed_global_constant: warning
      prefer_handle_prefixed_callback: warning
      # warning — CI 게이트, 위반 0 에서 켰다. 인셋 변환의 `geometry` 는 공개
      # API 라 optional 이고(필수로 바꾸면 소비 앱이 창 없이 깨진다), 빠뜨린
      # 호출은 밀도를 무시한 채 작성값을 그대로 그린다 — 화면에는 밀도를
      # 바꿔 보기 전까지 아무 증상이 없다. 레포 안에서 그것을 필수로 만드는
      # 것이 이 규칙이다.
      pass_theme_geometry: warning

linter:
  rules:
    # Very Good Analysis 기본 규칙
    no_default_cases: true # switch의 default 사용 지양(누락된 case를 조기에 드러내기 위함)

    # Claude Code 최적화 규칙 (AI 코드 생성 시 자주 위반되는 규칙들)
    always_declare_return_types: true
    avoid_print: true
    avoid_returning_null_for_void: true
    avoid_unused_constructor_parameters: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    sort_constructors_first: true
    unnecessary_const: true
    unnecessary_new: true
    use_super_parameters: true

    # Type safety 강화
    always_specify_types: false # 타입 추론 활용
    prefer_typing_uninitialized_variables: true
    avoid_dynamic_calls: true

    # 코드 품질
    avoid_redundant_argument_values: true
    prefer_expression_function_bodies: false # 가독성을 위해 비활성화
    use_named_constants: true

    ##
    # 새 린트 셋이 켜는 규칙 중, 이 리포가 문서로 못박은 구조와 정면으로
    # 부딪히는 것들. 괄호 안 숫자는 끄기 전에 실측한 위반 수다 — 숫자가
    # 아니라 구조가 근거이므로 숫자가 변해도 판단은 그대로다.
    ##

    # 원시토큰은 `abstract final class` + `static const` namespace 다
    # (core/design-tokens.md). 그 형태가 정확히 이 규칙이 금지하는 것이라,
    # 켜 두면 토큰 namespace·프리셋 홀더가 영구 위반으로 남는다 (22).
    avoid_classes_with_only_static_members: false

    # `@Deprecated` 필드도 `==`/`hashCode`/`copyWith`/`merge` 네 곳에 전부
    # 있어야 하고(core/style-contract.md), `verify_contracts.sh [8/8]` 가
    # 그것을 강제한다. 필드 하나를 deprecate 하는 순간 같은 패키지 안
    # 사용처가 기계적으로 생기며, 실측된 자리는 전부 그 보일러플레이트다 (444).
    deprecated_member_use_from_same_package: false

    # 제거 시점은 `process/deprecation.md` 가 소유한다 — 예고로부터 두 마이너
    # 뒤가 하한이고 `check_deprecation_policy.sh` 가 그 형식을 강제한다.
    # 이 리포는 0.x 라 모든 마이너가 breaking 이므로, 이 규칙은 그 창을
    # 무시하고 "지금 지워라" 를 말하게 된다 (326).
    remove_deprecations_in_breaking_versions: false

    # Text 체인 수식자와 셰이드로 해석되는 색 토큰은 프레임워크 값 타입
    # (`Color` 류)을 일부러 implements 한다 — 체인 API 가 그 형태 없이는
    # 성립하지 않는다 (4).
    avoid_implementing_value_types: false

    # Web 컴포넌트는 contract 의 플랫폼-부재 슬롯을 `Null` 로 채운다
    # (`CoreTextAreaContract<Component, Null, Null, …>`). `T = Null` 이면 그
    # 슬롯의 getter 가 `null` 을 돌려주고 호출부가 읽을 수 있지만, `T = void`
    # 면 그 값을 읽을 수 없어 contract 가 성립하지 않는다 (3).
    prefer_void_to_null: false

    # 같은 목적을 `async_return_with_no_await` 가 커버한다(그쪽은 켜 둔 채
    # 래칫으로 남긴다). 둘 다 켜면 같은 자리를 두 번 보고한다 (2).
    unnecessary_async: false

    # 생성기·픽스처의 멤버는 `main` 에서 도달 불가한 것이 정상이다 (1).
    unreachable_from_main: false

##
# Analyzer 전역 설정
# - 자동 생성/외부 제공 파일을 분석에서 제외하여 신호 대 잡음비를 높입니다.
##
analyzer:

  errors:
    # `lint/strict` 는 이것을 warning 으로 올린다. 이 리포의 CI 게이트는
    # `dart analyze . --fatal-warnings`(= warning 부터 차단)라, 그 승격은
    # 기존 13곳(resizer 12 · skeletonizer_config 1)을 그 자리에서 CI 실패로
    # 바꾼다 — 린트 셋 교체가 게이트 시맨틱을 바꾸지 않는 것이 전제이므로
    # 원래 severity 로 되돌린다. 새로 생기는 위반은 lefthook 의
    # `--fatal-infos`(staged 파일)가 그대로 막는다.
    parameter_assignments: info
    # 위젯 생성자에서 `child`/`children` 을 마지막에 둔다(cross-platform/api.md).
    # 프리셋은 INFO 로 켠다. 위반 0 이라 CI 게이트로 올린다 — 표준 린트는
    # 이 레버(analyzer.errors)가 먹는다. 플러그인 규칙은 먹지 않는다(위 plugins:).
    sort_child_properties_last: warning

  # 자동 생성 및 외부 제공 파일을 Dart 분석에서 제외합니다.
  exclude:
    - "**/**.freezed.dart"
    - "**/**.config.dart"
    - "**/**.module.dart"
    - "**/**.mock.dart"
    - "**/**.gr.dart"
    - "**/**.gm.dart"
    - "**/**.freezed.dart"
    - "**/**.g.dart"
    - "**/*_test.dart"
    - "**/injector.module.dart"
    - "package/pdfrx/**"
    - "docs/guides/templates/**"
    - "packages/coui_flutter/docs/**"
    - "packages/coui_mcp/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
