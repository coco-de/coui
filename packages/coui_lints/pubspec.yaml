name: coui_lints
description: >
  Dart analyzer plugin that reports CoUI cross-platform design-system
  conventions (see .claude/rules/) as IDE-integrated `dart analyze`
  diagnostics — the mechanically-checkable subset of those rules, as a
  faster, editor-time companion to scripts/guards/.
version: 0.6.0
publish_to: none
homepage: https://github.com/coco-de/coui
repository: https://github.com/coco-de/coui/tree/main/packages/coui_lints
issue_tracker: https://github.com/coco-de/coui/issues

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  analysis_server_plugin: ^0.3.0
  # 이 패키지의 규칙은 analyzer 13 의 구문 API(`NamedArgument` ·
  # `RegularFormalParameter`)를 쓴다. 워크스페이스는 단일 analyzer 버전으로
  # 해석되고, Flutter 3.50 의 flutter_test 가 pin 하는 test_api 0.7.14 에 맞는
  # test(1.32)와 jaspr_builder 0.24 도 같은 범위(>=13 <15)를 요구한다.
  # analysis_server_plugin 은 minor 마다 analyzer 를 exact-pin 하므로 실제
  # 해석 버전은 14.7.0 이다.
  analyzer: ">=13.3.0 <15.0.0"
  analyzer_plugin: any

dev_dependencies:
  analyzer_testing: any
  lint: any
  test: any
  test_reflective_loader: any
  very_good_analysis: any

topics:
  - lints
  - analyzer-plugin
  - coui-ui
