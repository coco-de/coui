name: Package checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tool/parity/**'
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/public-ci.yml'
      - 'codecov.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tool/parity/**'
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/public-ci.yml'
      - 'codecov.yml'

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
      - run: flutter pub get --no-example --enforce-lockfile

      - name: Test Core tokens and button contracts
        working-directory: packages/coui_core
        run: >-
          dart test --coverage-path=../../.dart_tool/coverage/coui_core.lcov
          test/token_scale_test.dart test/button_style_test.dart

      - name: Test Flutter controls and file handling
        working-directory: packages/coui_flutter
        run: >-
          flutter test --coverage --coverage-path=../../.dart_tool/coverage/coui_flutter.lcov
          test/components/control/button_test.dart
          test/components/form/rich_editor*_test.dart
          test/components/file_input_test.dart
          test/components/layout/tree_test.dart
          test/components/layout/tree_presentation_test.dart
          test/components/menu/dropdown_menu_activation_test.dart
          test/components/menu/dropdown_menu_test.dart
          test/components/overlay/trigger_tap_detector_test.dart
          test/components/control/clickable_keyboard_press_test.dart
          test/components/control/clickable_double_tap_test.dart
          test/components/control/clickable_reduced_motion_test.dart
          test/components/control/button_pressed_state_test.dart
          test/components/display/mockup_code_themed_padding_test.dart
          test/components/menu/dropdown_menu_premount_close_test.dart
          test/components/overlay/popover_test.dart
          test/components/overlay/popover_offset_test.dart
          test/components/overlay/popover_flip_report_test.dart
          test/components/overlay/popover_panel_rect_test.dart
          test/components/overlay/popover_glass_fade_test.dart
          test/components/popover_morph_test.dart
          test/components/overlay/tooltip_test.dart
          test/components/overlay/hover_card_test.dart
          test/hover_card_engine_decoupling_test.dart
          test/tooltip_engine_decoupling_test.dart
          test/components/modal_live_motion_test.dart
          test/parity/box_padding_breakpoint_showcase_units_test.dart
          test/parity/box_padding_showcase_allocation_units_test.dart test/parity/box_padding_additional_showcase_allocation_units_test.dart
          test/parity/box_padding_showcase_allocation_dispatch_test.dart
          test/parity/box_padding_text_showcase_units_test.dart
          test/parity/box_padding_observation_test.dart
          test/parity/box_padding_paired_test.dart

      - name: Test parity source contracts
        run: >-
          dart test --concurrency=1
          tool/parity/test/model/box_observation_source_spec_test.dart
          tool/parity/test/manifest/parity_manifest_test.dart
          tool/parity/test/web/breakpoint_showcase_ssr_source_test.dart
          tool/parity/test/web/breakpoint_showcase_dispatch_test.dart
          tool/parity/test/web/showcase_allocation_ssr_source_test.dart
          tool/parity/test/web/showcase_allocation_dispatch_test.dart
          tool/parity/test/web/text_showcase_ssr_source_test.dart
          tool/parity/test/web/text_showcase_dispatch_test.dart
          tool/parity/test/web/device_paint_source_probe_test.dart
          tool/parity/test/web/computed_style_probe_test.dart

      - name: Test Jaspr button and MockupCode
        working-directory: packages/coui_web
        run: >-
          dart test --coverage-path=../../.dart_tool/coverage/coui_web.lcov
          test/components/control/button_test.dart
          test/components/display/mockup_code_style_test.dart
          test/components/display/mockup_code_themed_padding_test.dart

      - name: Make LCOV paths repository-relative
        run: |
          workspace_prefix="SF:$(pwd -P)/"
          for package in coui_core coui_flutter coui_web; do
            report=".dart_tool/coverage/$package.lcov"
            awk -v prefix="$workspace_prefix" -v package="$package" '
              /^SF:lib\// { sub(/^SF:/, "SF:packages/" package "/") }
              index($0, prefix) == 1 { $0 = "SF:" substr($0, length(prefix) + 1) }
              { print }
            ' "$report" > "$report.tmp"
            mv "$report.tmp" "$report"
          done

      - name: Upload package coverage to Codecov
        if: github.repository == 'coco-de/coui'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          files: .dart_tool/coverage/coui_core.lcov,.dart_tool/coverage/coui_flutter.lcov,.dart_tool/coverage/coui_web.lcov
