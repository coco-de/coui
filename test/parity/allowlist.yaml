# 디자인 패리티 게이트 — 의도적 변경 승인 목록
#
# 게이트가 "항상 빨간불" 이면 우회되고, 우회되는 게이트는 없는 것만 못하다.
# 이 파일이 그 우회를 막는 정식 경로다.
#
# ── 승인 단위 ────────────────────────────────────────────────────────────────
# (key, signal, fingerprint) 다. 픽셀만 승인 대상으로 두면 "속성이 바뀐 의도적
# 변경" 을 승인할 방법이 없어 개발자가 게이트를 통째로 우회한다. 그래서 세 신호
# (pixel · property · motion) 전부가 승인 대상이다.
#
# 지문을 고정하는 이유: 승인은 "이 키를 앞으로 무시하라" 가 아니라 "정확히 이
# 결과물을 승인한다" 이다. 지문이 없으면 한 번 승인된 키가 이후의 진짜 회귀까지
# 조용히 통과시킨다.
#
# Flutter 와 Web 은 같은 변경이라도 산출물 지문이 다르므로 플랫폼마다 한 항목씩
# 등록한다(같은 key/signal 에 여러 항목이 올 수 있다).
#
# ── 만료 ─────────────────────────────────────────────────────────────────────
# `expires` 당일까지 유효하고 그 다음 날부터 **실패로 전환**된다. 로그에
# "만료됨" 이 명시된다. 예외가 영구 방치되지 않게 하는 장치이므로 만료일을
# 습관적으로 멀리 잡지 마라 — 승인의 수명은 그 변경이 baseline 으로 승격될
# 때까지여야 한다.
#
# ── 변경 권한 ────────────────────────────────────────────────────────────────
# 이 파일 변경에는 CODEOWNERS 리뷰가 필요하다. 이 시스템의 유일한 권한 개념은
# 인증이 아니라 코드 리뷰다.
#
# ── 예시 ─────────────────────────────────────────────────────────────────────
# entries:
#   - key: dialog-default-dark-neoBrutalism
#     signal: pixel            # pixel | property | motion
#     fingerprint: "3f786850e387550fdab836ed7e6dc881de23001b"
#     reason: "neo-brutalism 보더 두께 상향 (#3622)"
#     expires: "2026-11-01"    # YYYY-MM-DD (UTC 날짜)

