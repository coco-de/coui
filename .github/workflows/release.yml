name: Release

# main 머지 시 Release PR 을 생성/갱신하고, 그 PR 이 머지되면 버전 확정 + 태그 +
# GitHub Release(릴리즈 노트) 발행까지 한 번에 수행한다.
#
# 동작:
#   main 머지 (feat/fix/BREAKING)
#     └→ [Release PR] chore(main): release ...  ← 계속 누적·갱신됨
#          └→ (머지) → pubspec.yaml version 확정 + CHANGELOG.md + 태그 + GitHub Release
#
# GitHub 릴리스와 태그를 만든다. pub.dev 배포는 별도 pub-* 태그가 시작한다.
#
# ℹ️ 버전이 오르는 커밋 타입은 Conventional Commits 규격을 따른다:
#      feat:      → minor
#      fix:       → patch
#      <type>!: / BREAKING CHANGE → major
#    refactor/docs/chore/style/test/ci 는 CHANGELOG 에는 실리지만 버전을 올리지
#    않는다. 소비자에게 영향이 가는 변경(공개 API 제거·시그니처 변경 등)은
#    refactor 가 아니라 fix/feat 또는 `!` 접미사를 써야 릴리즈가 나간다.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Tag
    if: github.repository == 'coco-de/coui'
    runs-on: ubuntu-latest
    steps:
      # release-please 는 App 토큰으로 돌린다 — 기본 GITHUB_TOKEN 이 일으킨 이벤트는
      # 워크플로 실행을 시작하지 않아서(GitHub 동작), 그 토큰으로 연 릴리스 PR 은
      # 경로에 해당하는 자동 검사를 시작할 수 없다. App 토큰은 이를 허용한다.
      # 전체 CI는 수동 실행이며 로컬 검증 결과를 PR에 기록한다.
      # GitHub App 토큰은 설치 범위와 만료 시간이 정해져 있다.
      #
      # 자격증명이 안 닿으면 GITHUB_TOKEN 으로 내려앉되 **시끄럽게** 내려앉는다.
      # 하드 실패로 두면 시크릿 하나가 빠지거나 설치가 풀리는 날 릴리스가 통째로
      # 멈추고, 조용히 내려앉으면 "릴리스 PR 이 또 BLOCKED" 로만 보여 원인 조사를
      # 처음부터 반복하게 된다. 이 워크플로는 프로덕션에서만 검증되므로 어느 쪽도
      # 감당할 수 없다.
      - name: App 자격증명 확인
        id: creds
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'present=false' >> "$GITHUB_OUTPUT"
          echo "::warning title=릴리스 App 자격증명 없음::GITHUB_TOKEN 으로 내려앉았다 — 이 실행이 만들거나 갱신한 릴리스 PR 에는 경로 기반 자동 검사가 시작되지 않는다."
          {
            echo '### ⚠️ 릴리스 App 자격증명 없음'
            echo
            echo 'RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY 가 비어 GITHUB_TOKEN 으로 내려앉았다.'
            echo
            echo '**결과** — 이 실행이 만들거나 갱신한 릴리스 PR 에는 경로 기반 자동 검사가 시작되지 않는다.'
            echo '변경 범위에 맞는 가드와 테스트를 로컬에서 실행하고 PR에 결과를 기록한다.'
            echo
            echo '**복구** — 릴리스 App 이 이 레포에 설치돼 있는지 확인하고 두 시크릿을 채운다.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        if: steps.creds.outputs.present == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
