name: Package checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/public-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/public-ci.yml'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
      - run: flutter pub get --no-example --enforce-lockfile

      - name: Test Core tokens and button contracts
        working-directory: packages/coui_core
        run: dart test test/token_scale_test.dart test/button_style_test.dart

      - name: Test the Flutter button
        working-directory: packages/coui_flutter
        run: flutter test test/components/control/button_test.dart

      - name: Test the Jaspr button
        working-directory: packages/coui_web
        run: dart test test/components/control/button_test.dart
