name: 리디자인 스펙
description: 컴포넌트 계열 리디자인 스펙 (디자이너 작성)
title: "[리디자인] <계열명>"
labels: ["redesign"]
body:
  - type: markdown
    attributes:
      value: |
        디자이너가 작성한다. 이슈는 조사 전에 만들어도 되고, 1 · 2 · 4 · 5 · 6 번(3번이 "있음" 이면 3-1 도)은 **결정완료로 옮기기 전에** 채운다.
        칸이 다 차면(6번에 직접 "없음") 디자이너가 ZenHub 보드의 카드를 **결정완료** 로 옮긴다. 개발자는 결정완료 이슈만 가져간다. 반려 댓글은 `반려:` 로 시작한다.

        - Figma 사본은 원본 세트를 **⌘D 로 복제**해 **같은 페이지의 최상위**에 `<세트 이름>(리디자인)` 으로 둔다. 다른 페이지 · 다른 이름 · 복사 · 붙여넣기로 만든 사본이면 플러그인 대조가 돌지 않는다.
        - 3번이 "있음" 이면 이슈를 만든 뒤 `structure-change` 라벨을 붙인다.
        - PR 은 이 이슈를 닫지 않는다(`Part of #번호`). 개발자가 머지 후 캔버스 확인을 요청하면, 디자이너가 확인하고 닫는다.

        절차 전체: [디자이너 · 개발자 협업](https://github.com/coco-de/coui/blob/main/docs/contributing/design-collaboration.md)
  - type: input
    id: family
    attributes:
      label: 대상 계열과 컴포넌트
      placeholder: "Form 계열: TextField, TextArea, FormLabel, FormField, Fieldset"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 1. 무엇이 바뀌나
      description: 전후 값 표. 값은 토큰 이름으로 적는다. 토큰 스케일에 없는 값은 "새 토큰 필요" 로 표시한다. 이 표와 Figma 사본이 다르면 개발자는 질문한다.
      value: |
        | 컴포넌트 | 속성 | 전 | 후 |
        |---|---|---|---|
        |  |  |  |  |
  - type: textarea
    id: why
    attributes:
      label: 2. 왜
      description: 한두 문장. 조사와 실측 근거는 링크로.
  - type: dropdown
    id: structure
    attributes:
      label: 3. 구조 변경 여부
      description: 축, 변형, 컴포넌트 속성(불린 · 인스턴스 교체 · 텍스트)의 추가 · 삭제 · 이름 변경.
      options:
        - 없음
        - 있음
    validations:
      required: true
  - type: textarea
    id: structure-detail
    attributes:
      label: 3-1. 구조 변경 내용
      description: 있음일 때만. 무엇을 추가 · 삭제 · 이름 변경하는지, 그 이유, 그리고 캔버스 표현만 바뀌는지 코드 파라미터도 없어지는지.
  - type: textarea
    id: figma
    attributes:
      label: 4. Figma 링크
      description: 세트마다 한 줄 — 원본 옆 `<세트 이름>(리디자인)` 사본의 노드 링크.
      value: |
        - <세트 이름>(리디자인):
  - type: textarea
    id: criteria
    attributes:
      label: 5. 검수 기준
      description: '체크할 수 있는 문장으로 적는다. 플러그인 대조가 못 보는 것(컴포넌트 속성 · 그림자 같은 효과 · 정렬)의 동작은 반드시 적는다. 알고 남기는 차이는 "허용 차이: <변형> — <이유>" 로 적는다.'
  - type: textarea
    id: open
    attributes:
      label: 6. 열린 질문
      description: 질문이 없으면 직접 "없음" 이라고 적는다. 비워 두면 결정완료로 옮기지 않는다.
