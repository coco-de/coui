# 디자인 소스 카탈로그 — coco-de/docs/design 의 정본 판정 레코드.
#
# 이 파일이 답하는 질문은 딱 하나다: "coui_core 값과 코코드 문서가 갈릴 때
# 어느 문서를 근거로 삼는가." 값 자체의 SSOT 는 여전히 coui_core 다 — 이
# 파일은 coui_core 와 문서가 갈릴 때 참조하는 "결정 기록" 문서군의 신원을
# 고정할 뿐, coui_core 를 대체하지 않는다. 사람이 읽는 서술은
# docs_core/content/guides/design-sources.md(판정 · 충돌 · 고정 커밋) 참조 —
# 이 YAML 은 그 페이지의 기계 판독용 짝이다(같은 판정, 다른 표현).
#
# 정본은 동결(frozen)이 아니라 언제든 갱신될 수 있다. pinnedCommit 은 "이
# 판정이 어느 스냅샷을 근거로 했는지" 를 추적 가능하게 할 뿐이다.
# coco-de/docs 가 실질적으로 갱신되면 이 파일도 재고정한다(updateHistory
# 에 새 행 추가 + pinnedCommit 갱신).

repo: coco-de/docs
pinnedCommit: 2def5ab32e0b915df5add69c92091e7e5683889a
pinnedDate: '2026-08-05'
pinnedBy: '#3727'

updateHistory:
  - date: '2026-08-05'
    commit: 2def5ab32e0b915df5add69c92091e7e5683889a
    change: >
      Epic G 실행 — 색 체계 문서 · 모션과 형태 토큰 문서 · Icon Spec 과
      Size Rationale §2 갱신(충돌 2 의 실행) · 문서끼리 충돌 3건 결정.
  - date: '2026-08-04'
    commit: 05fc63f61d8de6d0f43de50f0cdd27bc5e997a3b
    change: >
      최초 고정 — 73종 카탈로그 분류(명세 34 · 결정기록 36 · 안내 3),
      우선순위 규칙 4개 수립, 충돌 3건(Taxonomy · Size↔Icon ·
      프리미티브↔컴포넌트) 판정.

# 문서 종류 분류 — spec 만 "코드가 참조해야 할 것" 후보다.
# rationale 은 D-9 정의상 값의 출처가 아니다(coui_core 가 SSOT).
documentTypes:
  specification:
    count: 34
    role: value-defining
    note: 코드가 참조하는 축의 후보. 파일명이 *_Specification.md 로 끝나거나 값을 규정하는 색상 문서.
  rationale:
    count: 36
    role: decision-record
    note: 왜 그렇게 정했는가를 적은 산문. 값의 출처 아님. 버전/날짜 헤더가 구조적으로 없음(예외 3건).
  readme:
    count: 3
    role: navigational
    note: 폴더 색인. 정본 판정 대상 아님.

# 우선순위 규칙 — 명세 대 명세, 또는 명세 대 코드가 갈릴 때 이 순서로 판정.
priorityRules:
  - id: doc-type
    order: 1
    rule: 결정 기록(rationale)의 서술 중 숫자가 우연히 언급돼도 값 출처가 아니다. 명세(specification)만 값을 규정한다.
  - id: primitive-governs-component
    order: 2
    rule: 컴포넌트 명세가 프리미티브 토큰을 참조하면서 그 프리미티브의 정의된 스케일 밖 값을 쓰면 프리미티브 명세가 이긴다.
  - id: tie-break-version
    order: 3
    rule: 같은 축의 두 문서가 갈리는데 날짜가 같으면 버전이 높은 쪽이 이긴다. 날짜·버전 모두 같으면 타이브레이커 없음 — 별도 결정 이슈로.
  - id: code-precedence
    order: 4
    rule: 문서 쪽 승자가 정해져도 코드에 근거(CI 가드·핀 테스트·근거 주석)가 있으면 문서를 갱신한다. 근거가 없으면 코드를 문서에 맞춘다.

# 확인된 충돌 3건과 판정 — 각 판정은 위 priorityRules 의 id 를 근거로 든다.
conflicts:
  - id: taxonomy
    axis: Badge/Tag/Chip 분류
    relatedDecision: D1 (#3768)
    docs:
      - path: design/component/CoUI_Badge_Tag_Chip_Taxonomy_Decision_Rationale.md
        version: '1.0'
        date: '2026-04-10'
        claims: Badge(알림 오버레이)/Tag(메타데이터 라벨)/Chip(대화형 선택) 3분류
      - path: design/component/CoUI_Tag_Chip_Taxonomy_Decision_Rationale.md
        version: '2.1'
        date: '2026-04-10'
        claims: "\"Chip\" 명칭 기각, Tag 계열(Tag/DismissibleTag/SelectableTag/EditableTag)로 재편"
    appliedRule: tie-break-version
    winner: design/component/CoUI_Tag_Chip_Taxonomy_Decision_Rationale.md
    status: canonical-pinned
    note: D1 과 동일 판정을 문서 신원으로 기록. 실제 컴포넌트 리네임은 #3768(범위 밖, 별도 Epic).

  - id: size-icon
    axis: Icon size 참조 사다리
    relatedDecision: "A-4′ = B (architecture-figma-token-sync D-9)"
    docs:
      - path: design/design-tokens/space/CoUI_Size_Token_Decision_Rationale.md
        version: '—'
        date: '—'
        claims: Size 관련 Component 토큰은 Space Primitive 를 참조
      - path: design/design-tokens/component/icon/CoUI_Icon_Size_Token_Specification.md
        version: '1.0'
        date: '2026-04-08'
        claims: "참조: Primitive > Font-size 토큰, 14단계(10–52)"
    appliedRule: code-precedence
    winner: "code — CoreIconSize (CoreSize 참조, 9단계 10–32, defaultSize=size24)"
    status: docs-superseded
    note: 코드 변경 불필요(이미 정합). Icon Spec §1.2/§2.1/§3.4 와 Size Rationale §2 가 census 근거 반영해 갱신 필요 — coco-de/docs 쪽 작업이라 이 레포가 직접 못 함, 추적만.

  - id: primitive-component-stroke
    axis: Border/stroke width — 1.5px · 5px
    relatedDecision: Epic K (#3767) stroke-width 축
    docs:
      - path: design/design-tokens/stroke-width/CoUI_Stroke_Width_Token_Specification.md
        version: '1.0'
        date: '2026-04-03'
        claims: 7 토큰(0/1/2/3/4/6/8)만 유효. §7에서 1.5px · 5px 를 비토큰 값 예시로 명시.
      - path: design/design-tokens/component/checkbox/CoUI_Checkbox_Size_Token_Specification.md
        version: '1.0'
        date: '2026-04-08'
        claims: "xs~sm: stroke-1.5 권장 (존재하지 않는 토큰 참조)"
      - path: design/design-tokens/component/radio/CoUI_Radio_Size_Token_Specification.md
        version: '1.0'
        date: '2026-04-08'
        claims: "xs~sm: stroke-1.5 권장 (동일 오류)"
    appliedRule: primitive-governs-component
    winner: design/design-tokens/stroke-width/CoUI_Stroke_Width_Token_Specification.md
    status: canonical-pinned
    note: CoreStrokeWidth 에 stroke1_5 가 있어 1.5 가 정식 토큰이다 — checkbox/radio 명세의 stroke-1.5 권장은 존재하는 토큰을 가리키고, checkbox 틀(전 크기)과 radio 쉬는 링(xs–lg)이 그 토큰을 읽는다. 5px 도 같다 — 사용자 결정으로 stroke5 가 정식 토큰이 되었고, radio lg · xl 의 켜진 고리(selectedIndicatorBorderWidth)가 그 토큰을 읽는다.

# 이 파일이 다루지 않는 것 — 우선순위 규칙을 적용해도 안 갈리는 진짜 판단이
# 필요한 문서-대-문서 충돌은 별도 결정 이슈로 간다(예: D2 duration/easing
# alias tier, D3 CoreContentPadding 존폐, D4 stroke-6 스펙 대 근거 — #3816).
outOfScope:
  - '#3816: D2(duration/easing alias tier) · D3(CoreContentPadding) · D4(stroke-6 spec-vs-rationale) — 내용 결정 자체'
  - '#3767: Epic K 컴포넌트 치수 축(button/checkbox/input/toggle/radio 등) 값 확정 — 이 파일은 정본 문서만 판정'
