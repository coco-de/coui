name: coui_web
description: "CoUI components for Jaspr with shared design tokens, type-safe theming, and a matching component API for Flutter."
version: 0.192.0
homepage: https://github.com/coco-de/coui
repository: https://github.com/coco-de/coui/tree/main/packages/coui_web
issue_tracker: https://github.com/coco-de/coui/issues

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

# Add regular dependencies here.
dependencies:
  coui_core: ^0.192.0
  jaspr: ">=0.23.5 <0.25.0"
  markdown: ^7.3.1
  meta: ^1.18.0
  syntax_highlight_lite: ^0.0.1
  universal_web: ^1.1.1+1
  web: ^1.1.1
dev_dependencies:
  build_runner: ^2.10.4
  build_web_compilers: ^4.4.6
  # The calendar tests fix the date a calendar treats as today with
  # `withClock` (`CoreCalendarView.currentTime`).
  clock: any
  html: ^0.15.0
  jaspr_builder: ^0.24.0-beta.1
  jaspr_lints: ^0.8.0-beta.0
  jaspr_test: ^0.24.0-beta.1
  lint: ^2.14.0
  very_good_analysis: ^11.0.0

  test: any
topics:
  - jaspr
  - ui-components
  - web
  - coui-ui
